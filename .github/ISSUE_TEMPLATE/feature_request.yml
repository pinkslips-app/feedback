# Adapted from AerioTV's issue templates by @jonzey231:
# https://github.com/jonzey231/AerioTV/tree/main/.github/ISSUE_TEMPLATE

name: Feature Request
description: Suggest a new feature or improvement for PinkSlips
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where would you like to see this feature?
      options:
        - Web
        - iOS app
        - Android app
        - All platforms
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: PinkSlips Version
      description: Enter the version shown in PinkSlips. Web users can enter "Web."
      placeholder: "Example: 8.0.7 or Web"
    validations:
      required: true

  - type: input
    id: shell-version
    attributes:
      label: Native Shell Version
      description: For the iOS or Android app, enter the installed shell version if known. Web users can enter "N/A."
      placeholder: "Example: 8.0 or N/A"
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Device or Browser
      description: Include your device, operating system, or browser.
      placeholder: "Example: iPhone 15 Pro on iOS 19, Pixel 9 on Android 16, or Chrome on Windows"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what is difficult or missing today.
      placeholder: "I want to..."
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What would you like PinkSlips to do?
      description: Explain how you think the feature should work.
      placeholder: "It would be useful if PinkSlips..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, links, or alternatives you have considered. Do not include passwords or private information.
    validations:
      required: false
